name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare le release quando si crea un tag v*

jobs:
  macos:
    runs-on: macos-15          # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configura (universal binary arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test del modello
        run: ./build/Release/circuit_test && ./build/Release/click_test

      - name: Firma ad-hoc e pacchetto
        run: |
          A=build/FYN2_artefacts/Release
          mkdir -p "dist/FYN-2"
          cp -R "$A/VST3/FYN-2.vst3" "$A/AU/FYN-2.component" "$A/Standalone/FYN-2.app" "dist/FYN-2/"
          for p in "dist/FYN-2/"*; do codesign --force --deep --sign - "$p"; done
          cp scripts/installa.command "dist/FYN-2/Installa FYN-2.command"
          chmod +x "dist/FYN-2/Installa FYN-2.command"
          cp README.md "dist/FYN-2/"
          cp -R docs/manuale "dist/FYN-2/Manuale"   # aprire Manuale/index.html nel browser
          lipo -info "dist/FYN-2/FYN-2.vst3/Contents/MacOS/FYN-2"
          ls "dist/FYN-2/FYN-2.app/Contents/Resources/"   # deve contenere Icon.icns
          (cd dist && ditto -c -k --keepParent "FYN-2" ../FYN2-macOS.zip)

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: FYN2-macOS
          path: FYN2-macOS.zip

      - name: Pubblica la release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" FYN2-macOS.zip \
            --title "Collateral Effects FYN-2 ${GITHUB_REF_NAME}" \
            --notes "Build macOS universale (Apple Silicon e Intel) con VST3, AU e Standalone."
